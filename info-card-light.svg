<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 204" width="490" height="204">
<style>text { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }.key { font-size: 13px; fill: #1a7f37; font-weight: 600; }.value { font-size: 13px; fill: #24292f; }.title { font-size: 12px; fill: #57606a; }</style>
<rect x="0.5" y="0.5" width="489" height="203" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1" />
<path d="M0.5,8 a8,8 0 0 1 8,-7.5 L481.5,0.5 a8,8 0 0 1 8,8 L489.5,34 L0.5,34 Z" fill="#f6f8fa" />
<line x1="0.5" y1="34" x2="489.5" y2="34" stroke="#d0d7de" stroke-width="1" />
<circle cx="20" cy="17.0" r="5" fill="#ff5f56" />
<circle cx="38" cy="17.0" r="5" fill="#ffbd2e" />
<circle cx="56" cy="17.0" r="5" fill="#27c93f" />
<text x="245.0" y="21.0" class="title" text-anchor="middle">whoami.sh</text>
<g opacity="0" transform="translate(14,0)">
  <text x="20" y="60" class="key">Now</text>
  <text x="120" y="60" class="value">Full-stack Developer</text>
  <animate attributeName="opacity" from="0" to="1" begin="0.000s" dur="0.4s" fill="freeze" />
  <animateTransform attributeName="transform" type="translate" from="14,0" to="0,0" begin="0.000s" dur="0.4s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" />
</g>
<g opacity="0" transform="translate(14,0)">
  <text x="20" y="90" class="key">Prev</text>
  <text x="120" y="90" class="value">Eduvos student (IT/Robotics)</text>
  <animate attributeName="opacity" from="0" to="1" begin="0.150s" dur="0.4s" fill="freeze" />
  <animateTransform attributeName="transform" type="translate" from="14,0" to="0,0" begin="0.150s" dur="0.4s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" />
</g>
<g opacity="0" transform="translate(14,0)">
  <text x="20" y="120" class="key">Stack</text>
  <text x="120" y="120" class="value">Full stack (JS/TS + Java)</text>
  <animate attributeName="opacity" from="0" to="1" begin="0.300s" dur="0.4s" fill="freeze" />
  <animateTransform attributeName="transform" type="translate" from="14,0" to="0,0" begin="0.300s" dur="0.4s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" />
</g>
<g opacity="0" transform="translate(14,0)">
  <text x="20" y="150" class="key">Learning</text>
  <text x="120" y="150" class="value">Robotics &amp; Intelligent Systems (Eduvos)</text>
  <animate attributeName="opacity" from="0" to="1" begin="0.450s" dur="0.4s" fill="freeze" />
  <animateTransform attributeName="transform" type="translate" from="14,0" to="0,0" begin="0.450s" dur="0.4s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" />
</g>
<g opacity="0" transform="translate(14,0)">
  <text x="20" y="180" class="key">Highlights</text>
  <text x="120" y="180" class="value">Enterprise clients: FNB, WesBank, Vodacom, KPN</text>
  <animate attributeName="opacity" from="0" to="1" begin="0.600s" dur="0.4s" fill="freeze" />
  <animateTransform attributeName="transform" type="translate" from="14,0" to="0,0" begin="0.600s" dur="0.4s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" />
